name: Build and Test Python Wheels

on:
  workflow_call:
    inputs:
      include_heavy_python_examples:
        description: "Also test heavyweight Python examples such as Torch and CuTe."
        required: false
        type: boolean
        default: false
      floating_python_example_dependencies:
        description: "Test Python examples with unconstrained floating dependencies and print constraints candidates."
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      include_heavy_python_examples:
        description: "Also test heavyweight Python examples such as Torch and CuTe."
        required: false
        type: boolean
        default: false
      floating_python_example_dependencies:
        description: "Test Python examples with unconstrained floating dependencies and print constraints candidates."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 10 * * 1'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build-wheels:
    name: Build wheel (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-CUDA wheel
        run: |
          bash ci/build_multi_cuda_wheel.sh -py-version ${{ matrix.python }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cuda_bench-py${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 7
          if-no-files-found: error

  # Test wheels on all CUDA/Python combinations
  # Each wheel contains extensions for both CUDA 12 & 13, runtime detection picks the right one
  test-wheels:
    name: Test wheel (CUDA ${{ matrix.cuda }}, Python ${{ matrix.python }})
    needs: build-wheels
    runs-on: linux-amd64-gpu-l4-latest-1
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12', '13']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-cuda_bench-py${{ matrix.python }}
          path: wheelhouse

      - name: Test wheel
        run: |
          bash ci/test_cuda_bench.sh \
            -py-version ${{ matrix.python }} \
            -cuda-version ${{ matrix.cuda }}

  # Exercise committed examples against the built wheel. PR runs use constrained
  # dependencies for stability; scheduled/manual floating runs catch upstream
  # dependency drift.
  test-python-examples:
    name: Test Python examples (standard, CUDA 13, Python 3.13)
    needs: build-wheels
    runs-on: linux-amd64-gpu-l4-latest-1
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-cuda_bench-py3.13
          path: wheelhouse

      - name: Test Python examples
        env:
          INCLUDE_HEAVY_PYTHON_EXAMPLES: ${{ github.event_name == 'schedule' || inputs.include_heavy_python_examples }}
          FLOATING_PYTHON_EXAMPLE_DEPENDENCIES: ${{ github.event_name == 'schedule' || inputs.floating_python_example_dependencies }}
        run: |
          args=()
          if [[ "${INCLUDE_HEAVY_PYTHON_EXAMPLES}" == "true" ]]; then
            args+=("-include-heavy-examples")
          fi
          if [[ "${FLOATING_PYTHON_EXAMPLE_DEPENDENCIES}" == "true" ]]; then
            args+=("-floating-deps")
          fi

          bash ci/test_python_examples.sh \
            -py-version 3.13 \
            "${args[@]}"

  verify-workflow:
    name: Verify all builds and tests succeeded
    if: ${{ always() }}
    needs:
      - build-wheels
      - test-wheels
      - test-python-examples
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          if [[ "${{ needs.build-wheels.result }}" != "success" ]]; then
            echo "Wheel builds failed!"
            exit 1
          fi
          if [[ "${{ needs.test-wheels.result }}" != "success" ]]; then
            echo "Wheel tests failed!"
            exit 1
          fi
          if [[ "${{ needs.test-python-examples.result }}" != "success" ]]; then
            echo "Python example tests failed!"
            exit 1
          fi
          echo "All wheels built and tested successfully!"
